[project]
name = "tcga-medallion-flow"
version = "1.0.0"
description = "Ejecutor visual tipo KNIME para los ETL medallón (TCGA v3, GEMAMX v1/v2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "uvicorn[standard]==0.34.0",
    "tcga-medallion-etl",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff>=0.8,<1",
]

[tool.uv.sources]
tcga-medallion-etl = { path = "../etl", editable = false }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcga_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not integration"]
markers = [
    "integration: requiere PostgreSQL",
    "testclient: usa FastAPI TestClient",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E9", "F"]
