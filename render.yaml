# Simple Render Blueprint for testing
version: "1"
services:
  - type: postgresql
    name: tcga-postgres
    plan: free
    databaseName: tcga
    user: tcga_admin

  - type: web
    name: tcga-web
    plan: free
    dockerfilePath: ./web/Dockerfile.render
    startCommand: /app/start.sh
    healthCheckPath: /health

  - type: worker
    name: tcga-etl
    plan: free
    dockerfilePath: ./etl/Dockerfile.render
    startCommand: /app/entrypoint.sh tcga --help