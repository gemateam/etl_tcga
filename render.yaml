# Render Blueprint: TCGA Medallion
# https://dashboard.render.com/blueprints
# Plan gratis: PostgreSQL + Web Service (no workers disponibles)

version: "1"
services:
  # Servicio web (FastAPI + Jinja2 + HTMX + Plotly)
  # También ejecutará el ETL manualmente via shell
  - type: web
    name: tcga-web
    plan: free
    runtime: docker
    dockerfilePath: ./web/Dockerfile.render.unified
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: tcga-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: tcga-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: tcga-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: tcga-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: tcga-postgres
          property: password
      - key: DUCKDB_MEMORY_LIMIT
        value: 512MB
      - key: DUCKDB_THREADS
        value: "2"
      - key: GDC_PROJECTS
        value: TCGA-BRCA
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_DIR
        value: /data
      - key: SQL_DIR
        value: /sql
      - key: RENDER_DEPLOYMENT
        value: "true"
      # Para ETL manual
      - key: DATABASE_URL
        fromDatabase:
          name: tcga-postgres
          property: connectionString

databases:
  # Base de datos PostgreSQL administrada
  - name: tcga-postgres
    plan: free
    databaseName: tcga
    user: tcga_admin
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere